# Optional overlay only. Does not overwrite the user's existing infra/compose.yaml.
# Usage: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.phase10-health.yaml up --build -d
services:
  app:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; url='http://127.0.0.1:'+os.environ.get('PORT','8000')+'/api/v1/health/ready'; urllib.request.urlopen(url,timeout=4).close()"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 45s
