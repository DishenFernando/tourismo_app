
name: tourismo

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourismo
      POSTGRES_USER: tourismo
      POSTGRES_PASSWORD: tourismo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourismo -d tourismo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - vendor_documents:/app/private_vendor_documents
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    profiles: ["vendor-scan"]
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav

volumes:
  db_data:
  vendor_documents:
  clamav_signatures:
